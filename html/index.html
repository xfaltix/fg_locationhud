<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet" />
    <link href="./css/main.css" rel="stylesheet" />
    <title>FG Location Hud</title>
</head>
<body>
    <div class="location_container">
        <span class="location_direction">NE</span>
        <span class="location_street">Bay City Ave</span>
        <span class="location_postal">8206</span>
        <div class="location_img"></div>
        <span class="location_place">Vespucci Beach</span>
    </div>

    <div class="ls2" id="hud_style2">
        <div class="ls2_place"><span class="ls2_place_text">Bay City Ave</span></div>
        <div class="ls2_card">
            <div class="ls2_info">
                <span class="ls2_street">Vespucci Beach</span>
                <span class="ls2_meta"><span class="ls2_meta_label">PLZ</span><span class="ls2_postal">8206</span></span>
            </div>
            <div class="ls2_compass">
                <svg class="ls2_arrow" viewBox="0 0 24 24"><path d="M12 2.5 L19.5 20.5 L12 16.2 L4.5 20.5 Z" /></svg>
                <span class="ls2_dir">NE</span>
            </div>
        </div>
    </div>

    <div class="style_panel" id="style_panel">
        <div class="style_panel_title">HUD-Style</div>
        <div class="seg" data-active="1">
            <div class="seg_thumb"></div>
            <button class="seg_btn active" data-style="1">Style 1</button>
            <button class="seg_btn" data-style="2">Style 2</button>
        </div>
        <button class="style_done" id="style_done">Speichern</button>
        <div class="style_panel_hint">Ziehen = Verschieben &middot; Enter = Speichern</div>
    </div>

    <script src="./js/script.js"></script>
</body>
</html>
